# --------------------------------------------------------------
# Window rules
# https://wiki.hypr.land/Configuring/Window-Rules/#window-rules
# --------------------------------------------------------------

# Suppress maximize events globally
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# No shadow and No dim for tiled windows
windowrule {
    name = no-shadow
    match:class =  .*
    no_dim = on
    no_shadow = on
}

# Idle inhibit when fullscreen
windowrule {
    name = idle-inhibit-fullscreen
    match:fullscreen = true
    idle_inhibit = fullscreen
}

# Float common utility windows ---------------------------------
# PolicyKit agent
windowrule {
    name = float-polkit
    match:class = (polkit-gnome-authentication-agent-1)
    float = yes
}

# Network managers
windowrule {
    name = float-network-managers
    match:class = (nm-connection-editor|blueman-manager)
    float = yes
}

# Rofi
windowrule {
    name = float-rofi
    match:class = (rofi)
    float = yes
}

# Gnome Calculator
windowrule {
    name = float-calculator
    match:class = (org.gnome.Calculator)
    float = yes
}

# Opacity Rules ------------------------------------------------
# opacity = focused unfocused
windowrule {
    name = rofi-opacity
    match:class = Rofi
    opacity = 0.9 0.6
}

windowrule {
    name = kitty-opacity
    match:class = kitty
    opacity = 0.7 0.7
}

windowrule {
    name = nautilus-opacity
    match:class = org.gnome.Nautilus
    opacity = 0.7 0.7
}

# Picture-in-Picture (PIP) -------------------------------------
windowrule {
    name = Picture-in-Picture
    match:title = Picture-in-Picture

    float = yes
    pin = yes
    size = 25% 25%
    move = 72% 7%
    opacity = 0.95 0.75
}

# Fix XWayland Drag Issues -------------------------------------
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = yes
}


# --------------------------------------------------------------
# Layer rules
# https://wiki.hypr.land/Configuring/Window-Rules/#layer-rules
# --------------------------------------------------------------

# SwayNC
layerrule2 = blur, swaync-control-center
layerrule2 = blur, swaync-notification-window
layerrule2 = ignorezero, swaync-control-center
layerrule2 = ignorezero, swaync-notification-window
layerrule2 = ignorealpha 0.5, swaync-control-center
layerrule2 = ignorealpha 0.5, swaync-notification-window
