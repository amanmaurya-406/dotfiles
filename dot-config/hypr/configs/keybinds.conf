# -----------------------------------------------------
# Key bindings
# https://wiki.hypr.land/Configuring/Binds/
# -----------------------------------------------------

$mainMod = SUPER
$scripts = $HOME/.config/hypr/scripts

$terminal = kitty
$fileManager = nautilus --new-window
$menu = rofi -show drun
$browser = chromium
$calculator = gnome-calculator
$notification = swaync-client -t -sw # swayNC panel

$left = h
$right = l
$up = k
$down = j


# Windows control -----------------------------------------------------------
    # Commands
    bind = $mainMod, Q, killactive,
    bind = $mainMod, F, fullscreen, 0       # Set active window to Fullscreen
    bind = $mainMod, M, fullscreen, 1       # Maximize Window
    bind = $mainMod, T, togglefloating,     # toggle active window float
    bind = $mainMod SHIFT, T, workspaceopt, allfloat, # Toggle all windows into floating mode 
    bind = $mainMod ALT, F, exec, hyprctl dispatch workspaceopt allfloat #All windows float 

    # Move focus with mainMod + arrow keys
    bind = $mainMod, left, movefocus, l
    bind = $mainMod, right, movefocus, r
    bind = $mainMod, up, movefocus, u
    bind = $mainMod, down, movefocus, d

    bind = $mainMod, $left, movefocus, l
    bind = $mainMod, $right, movefocus, r
    bind = $mainMod, $up, movefocus, u
    bind = $mainMod, $down, movefocus, d

    # Resize active window
    binde = $mainMod SHIFT, left, resizeactive, -50 0
    binde = $mainMod SHIFT, right, resizeactive, 50 0
    binde = $mainMod SHIFT, up, resizeactive, 0 -50
    binde = $mainMod SHIFT, down, resizeactive, 0 50

    binde = $mainMod SHIFT, $left, resizeactive, -50 0
    binde = $mainMod SHIFT, $right, resizeactive, 50 0
    binde = $mainMod SHIFT, $up, resizeactive, 0 -50
    binde = $mainMod SHIFT, $down, resizeactive, 0 50

    # Move active window
    # bind = $mainMod CTRL, left, movewindow, l
    # bind = $mainMod CTRL, right, movewindow, r
    # bind = $mainMod CTRL, up, movewindow, u
    # bind = $mainMod CTRL, down, movewindow, d
    #
    # bind = $mainMod CTRL, $left, movewindow, l
    # bind = $mainMod CTRL, $right, movewindow, r
    # bind = $mainMod CTRL, $up, movewindow, u
    # bind = $mainMod CTRL, $down, movewindow, d

    # Move/resize windows with mainMod + LMB/RMB and dragging
    bindm = $mainMod, mouse:272, movewindow
    bindm = $mainMod, mouse:273, resizewindow


    # Master Layout
    bind = $mainMod CTRL, D, layoutmsg, removemaster
    bind = $mainMod, I, layoutmsg, addmaster
    bind = $mainMod, J, layoutmsg, cyclenext
    bind = $mainMod, K, layoutmsg, cycleprev
    # bind = $mainMod, M, exec, hyprctl dispatch splitratio 0.3

    # Groups
    bind = $mainMod, G, togglegroup
    bind = ALT, tab, changegroupactive  #change focus to another window
#

# Workspaces ----------------------------------------------------------------
    # Switch workspaces with mainMod + [0-9]
    bind = $mainMod, 1, workspace, 1  # Open workspace 1
    bind = $mainMod, 2, workspace, 2  # Open workspace 2
    bind = $mainMod, 3, workspace, 3  # Open workspace 3
    bind = $mainMod, 4, workspace, 4  # Open workspace 4
    bind = $mainMod, 5, workspace, 5  # Open workspace 5
    bind = $mainMod, 6, workspace, 6  # Open workspace 6
    bind = $mainMod, 7, workspace, 7  # Open workspace 7
    bind = $mainMod, 8, workspace, 8  # Open workspace 8
    bind = $mainMod, 9, workspace, 9  # Open workspace 9
    bind = $mainMod, 0, workspace, 10 # Open workspace 10

    # Move active window to a workspace silently mainMod + SHIFT [0-9]
    bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1  # Move active window silently to workspace 1
    bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2  # Move active window silently to workspace 2
    bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3  # Move active window silently to workspace 3
    bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4  # Move active window silently to workspace 4
    bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5  # Move active window silently to workspace 5
    bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6  # Move active window silently to workspace 6
    bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7  # Move active window silently to workspace 7
    bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8  # Move active window silently to workspace 8
    bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9  # Move active window silently to workspace 9
    bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10 # Move active window silently to workspace 10

    # Move active window and follow to workspace mainMod + CTRL [0-9]
    bind = $mainMod CTRL, 1, movetoworkspace, 1  # Move active window to workspace 1
    bind = $mainMod CTRL, 2, movetoworkspace, 2  # Move active window to workspace 2
    bind = $mainMod CTRL, 3, movetoworkspace, 3  # Move active window to workspace 3
    bind = $mainMod CTRL, 4, movetoworkspace, 4  # Move active window to workspace 4
    bind = $mainMod CTRL, 5, movetoworkspace, 5  # Move active window to workspace 5
    bind = $mainMod CTRL, 6, movetoworkspace, 6  # Move active window to workspace 6
    bind = $mainMod CTRL, 7, movetoworkspace, 7  # Move active window to workspace 7
    bind = $mainMod CTRL, 8, movetoworkspace, 8  # Move active window to workspace 8
    bind = $mainMod CTRL, 9, movetoworkspace, 9  # Move active window to workspace 9
    bind = $mainMod CTRL, 0, movetoworkspace, 10 # Move active window to workspace 10

    # Move using tab
    bind = $mainMod, tab, workspace, m+1
    bind = $mainMod SHIFT, tab, workspace, m-1

    # Scroll through existing workspaces with mainMod + scroll
    bind = $mainMod, mouse_down, workspace, e+1
    bind = $mainMod, mouse_up, workspace, e-1
    bind = $mainMod, period, workspace, e+1
    bind = $mainMod, comma, workspace, e-1

    # Special workspace
    bind = $mainMod SHIFT, U, movetoworkspace, special
    bind = $mainMod, U, togglespecialworkspace,
#

# Scripts -------------------------------------------------------------------
    # Brightness control
    bindel = ,XF86MonBrightnessUp, exec, $scripts/brightness.sh --inc
    bindel = ,XF86MonBrightnessDown, exec, $scripts/brightness.sh --dec

    # Sound control
    bindel = ,XF86AudioMute, exec, $scripts/volume-control.sh --toggle #play/pause toggle
    bindel = ,XF86AudioRaiseVolume, exec, $scripts/volume-control.sh --inc #volume up
    bindel = ,XF86AudioLowerVolume, exec, $scripts/volume-control.sh --dec #volume down
    bindel = ,XF86AudioMicMute, exec, $scripts/volume-control.sh --toggle-mic #mice toggle

    # Media control
    bindel = $mainMod, SPACE, exec, $scripts/media-control.sh --pause
    bindel = $mainMod SHIFT, N, exec, $scripts/media-control.sh --nxt
    # bindel = $mainMod CTRL, N, exec, $scripts/media-control.sh --prv


    # Screenshot keybindings NOTE: You may need to press Fn key as well
    bind = ,Print, exec, $scripts/screenshot.sh --now
    bind = SHIFT, Print, exec, $scripts/screenshot.sh --area
    bind = CTRL, Print, exec, $scripts/screenshot.sh --in5 #screenshot in 5 secs

    # Launchers
    bind = $mainMod, Return, exec, $terminal
    bind = $mainMod, B, exec, $browser
    bind = $mainMod, C, exec, $calculator
    bind = $mainMod, D, exec, $menu
    bind = $mainMod, E, exec, $fileManager
    bind = $mainMod, N, exec, $notification
    bind = $mainMod, V, exec, $scripts/clip-manager.sh
    bind = $mainMod, X, exec, $scripts/powermenu.sh
#

# Hyprland ------------------------------------------------------------------
bind = CTRL ALT, Delete, exec, hyprctl dispatch exit 0
