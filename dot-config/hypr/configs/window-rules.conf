# ==========================================================
# HYPRLAND WINDOW RULES (NEW STRUCTURED FORMAT)
# ==========================================================

# Suppress maximize events globally ------------------------
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# No shadow and No dim for tiled windows
windowrule {
    name = no-shadow
    match:class =  .*
    no_dim = on
    no_shadow = on
}

# Idle inhibit when fullscreen -----------------------------
windowrule {
    name = idle-inhibit-fullscreen
    match:fullscreen = true
    idle_inhibit = fullscreen
}

# Float common utility windows -----------------------------
windowrule {
    name = float-polkit
    match:class = org.kde.polkit-kde-authentication-agent-1
    float = yes
}

windowrule {
    name = float-network-managers
    match:class = nm-connection-editor|blueman-manager
    float = yes
}

windowrule {
    name = float-rofi
    match:class = rofi
    float = yes
}

# Opacity Rules --------------------------------------------
# opacity = focused unfocused
windowrule {
    name = rofi-opacity
    match:class = Rofi
    opacity = 0.9 0.6
}

windowrule {
    name = kitty-opacity
    match:class = kitty
    opacity = 0.7 0.7
}

# Picture-in-Picture (PIP) ---------------------------------
windowrule {
    name = pip-rules
    match:title = Picture-in-Picture

    float = yes
    pin = yes
    size = 25% 25%
    move = 72% 7%
    opacity = 0.95 0.75
}

# XWayland Video Bridge Fix (Discord screen share, etc.) ---
windowrule {
    name = xwaylandvideobridge-fix
    match:class = xwaylandvideobridge

    opacity = 0.0 override 0.0 override
    no_anim = yes
    no_initial_focus = yes
    max_size = 1 1
    no_blur = yes
}

# Fix XWayland Drag Issues ---------------------------------
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = yes
}


