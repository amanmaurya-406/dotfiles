[colors.primary]
background = "#1e1e2e" # Base
foreground = "#cdd6f4" # Text

[colors.cursor]
text = "#1e1e2e"
cursor = "#cdd6f4"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#f9e2af" # Yellow

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6e3a1" # Green

[colors.hints.start]
foreground = "#1e1e2e"
background = "#f9e2af" # Yellow

[colors.hints.end]
foreground = "#1e1e2e"
background = "#45475a" # Surface 1

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#cdd6f4"
background = "#181825" # Mantle

[colors.selection]
text = "#cdd6f4"
background = "#313244" # Surface 0

[colors.normal]
black   = "#45475a" # Surface 1
red     = "#f38ba8" # Red
green   = "#a6e3a1" # Green
yellow  = "#f9e2af" # Yellow
blue    = "#89b4fa" # Blue
magenta = "#cba6f7" # Mauve
cyan    = "#94e2d5" # Teal
white   = "#bac2de" # Subtext 1

[colors.bright]
black   = "#6c7086" # Overlay 0
red     = "#eba0ac" # Maroon
green   = "#a6e3a1" # Green
yellow  = "#fab387" # Peach
blue    = "#b4befe" # Lavender
magenta = "#f5c2e7" # Pink
cyan    = "#89dceb" # Sky
white   = "#cdd6f4" # Text

[colors]
draw_bold_text_with_bright_colors = true
